<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>KeepJobs creation de compte</title>
    <link rel="stylesheet" href="css/fichier.css">
    <script type="module" src="java/java.js"></script>
    
</head>
<body class="pageAjoutJob">
    <main class="mainAjoutJob">
        <section>
    <header>
        <div class="boutonTitreHeader">
            <div>
                <button class="boutonModal1">
                    <img src="burger bar.jpg" alt="image" class="imageModal1">
                </button>
            </div>
     <div  class="titreAjoutJob">
        <span class="titreAjout1">Keep</span> 
         <span class="titreAjout2">Jobs</span>
        </div>
        <div>
            <img src="logo.png" alt="image du Logo" class="logo">
        </div>
         </div>
         <span class="titrePricipale">Ajouter un job</span><br>
         <span class="phrase">Remplir les informations de la candidacture</span>

</header>
        </section>

        <section>
            <form class="formulaireCreationCompte">
       <div > <strong class="elementAjout1">Entreprise:</strong><br>
        <input type="text" name="nom" placeholder="Ex: KeepJobs"  class="element">
       </div>
       <div ><strong class="elementAjout2">Poste:</strong> <br>
        <input type="text" name="prenom" placeholder="Ex: Developpeur Web" class="element">
       </div>
       <div>
        <strong class="elementAjout3">Date:</strong><br>
        <input type="text" placeholder="jj/mm/aaa" class="element">
       </div>
       <div ><strong class="elementAjout4">Statut:</strong> <br>
      
    <select name="statut" class="element">
        <option value="">-- Choisir un statut --</option>
        <option value="envoye">Envoyé</option>
        <option value="entrevue">Entrevue</option>
        <option value="embauche">Embauché</option>
        <option value="refuse">Refusé</option>
    </select>
</div>
<div>
    <strong class="elementAjout5">Note :</strong> <br>
    <textarea name="note" class="element noteArea" placeholder="Ajouter une note..."></textarea>
</div>

       <div>
        <button class="sumitAjout">Ajouter le job</button>
       </div>
       </form>
        </section>
    
        <section>
            <footer class="footer">
<a href="mesJobs.html"><img src="burger bar.jpg" alt="image" class="imageFooter"></a><br>
<span class="titreFooter">Mes jobs</span>
</footer>
        </section>
    </main>


  
</body>

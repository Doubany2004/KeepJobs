<body class="creationDeCompte">

<main class=" descriptionConnexion">

        <br> <span class="erreur" id="erreurMotDePasseEmail"></span>
       </div>
       <div>
        <a href="MotPasseOublie.html" class="motPasseOublie">Mot de passe oublié?</a>
       </div>
       <div>
        <button class="sumitConnexion" id="bouttonConnexion" type="button">Se connecter</button>
       </div>
       </form>
    


</main>

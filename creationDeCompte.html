<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KeepJobs creation de compte</title>
    <link rel="stylesheet" href="css/fichier.css">
     <script type="module" src="java/java.js"></script>


    
    
</head>

<body class="creationDeCompte">
<header>
     <h5 class="titreCompte">
        
        <span class="titre1">Keep</span> 
         <span class="titre2">Jobs</span>
        </h5>
         <span class="sloganCompte">Toutes les candidatures au même endroit.</span>
       
</header>
<main class=" descriptionCompte">

   
       <div class="titreCompte1"><strong>Creer votre compte</strong> </div> 
       <div class="descriptionCompte1">
        Rejoigner KeepJobs et commencer a suivre
        <br>vos candidature facilement.
       </div>
       <form class="formulaireCreationCompte">
       <div > <strong class="element1">Nom:</strong><br>
        <input type="text" name="nom" placeholder="Entrez votre nom"  class="element" id="nom">
        <br> <span class="erreur" id="erreurNom"></span>
       </div>
       <div ><strong class="element2">Prenom:</strong> <br>
        <input type="text" name="prenom" placeholder="Entrez votre prenom" class="element" id="prenom">
        <br> <span class="erreur" id="erreurPrenom"></span>
       </div>
       <div>
        <strong class="element3">Profession</strong><br>
        <input type="text" placeholder="Entrez votre profession" class="element" id="profession">
        <br> <span class="erreur" id="erreurProfession"></span>
       </div>
       <div ><strong class="element4">Email:</strong> <br>
        <input type="email" name="email" placeholder="Entrez votre email" class="element" id="email">
        <br> <span class="erreur" id="erreurEmail"></span>
       </div>
       <div ><strong class="element5">Mot de passe:</strong> <br>
        <input type="password" name="mot_de_passe" placeholder="Créez un mot de passe"  class="element" id="mot_de_passe">
        <br> <span class="erreur" id="erreurMotDePasse"></span>
       </div>
<div ><strong class="element6">Confirmer le mot de passe:</strong> <br>
        <input type="password" name="confirmer_mot_de_passe" placeholder="Confirmez votre mot de passe"  class="element" id="confirmer_mot_de_passe">
        <br> <span class="erreur" id="erreurConfirmerMotDePasse"></span>
       </div>
       
       <div>
        <button class="sumitCompte bouttonHover" id="bouttonCreationCompte" type="button">Creer un compte</button>
       </div>
       </form>
    


</main>
    
 
</body>

</html>
